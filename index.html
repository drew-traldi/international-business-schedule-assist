<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian — World Clock</title>
<meta name="description" content="World clock and meeting planner. See every team&#x27;s local time and slide through the day to find a slot that works for everyone.">
<meta property="og:title" content="Meridian">
<meta property="og:description" content="World clock and meeting planner. See every team&#x27;s local time and slide through the day to find a slot that works for everyone.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://drew-traldi.github.io/international-business-schedule-assist/">
<meta name="twitter:card" content="summary">
<meta name="author" content="Drew Traldi">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#05060f;color:#e7e9ff;font-family:'Outfit',system-ui,sans-serif;overflow-x:hidden}
canvas{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:1;max-width:1100px;margin:auto;padding:40px 20px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:30px}
h1{font-weight:200;font-size:clamp(34px,6vw,60px);letter-spacing:12px}
.local{text-align:right;font-weight:200}
.local b{font-size:clamp(28px,5vw,44px);font-weight:400;display:block;font-variant-numeric:tabular-nums}
.add{display:flex;gap:8px;max-width:100%}
header>div{min-width:0;max-width:100%}
.add input{flex:1 1 240px;min-width:0}
@media (max-width:640px){.add input{font-size:16px!important}}
.add input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#fff;padding:10px 14px;border-radius:30px;font:14px 'Outfit';width:240px;outline:none}
.add button{background:linear-gradient(135deg,#7c5cff,#27c5ff);border:0;color:#fff;padding:10px 18px;border-radius:30px;font:600 14px 'Outfit';cursor:pointer}
.slider{margin:10px 0 26px;display:flex;align-items:center;gap:14px;font-size:13px;color:#9aa0c8}
.slider input{flex:1;accent-color:#7c5cff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.c{position:relative;border-radius:22px;padding:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);overflow:hidden}
.c .sky{position:absolute;inset:0;opacity:.35;z-index:-1}
.c .x{position:absolute;right:12px;top:10px;background:none;border:0;color:#fff;opacity:0;cursor:pointer;font-size:18px}
.c:hover .x{opacity:.6}
.c h3{font-weight:400;font-size:18px}
.c small{color:#9aa0c8;font-size:12px}
.c .t{font-size:44px;font-weight:200;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.c .t span{font-size:18px;color:#9aa0c8}
.c .d{display:flex;justify-content:space-between;font-size:13px;color:#c5c9ef}
.dayline{height:6px;border-radius:3px;margin-top:12px;background:linear-gradient(90deg,#141a3a 0%,#141a3a 22%,#ff9d5c 27%,#8fd3ff 40%,#8fd3ff 65%,#ff7a59 75%,#141a3a 82%);position:relative}
.dayline i{position:absolute;top:-4px;width:3px;height:14px;background:#fff;border-radius:2px;box-shadow:0 0 8px #fff}
datalist{display:none}
.hint{font-size:12px;color:#6b7099;margin-top:20px;text-align:center}

/* mobile: 16px fields stop iOS focus-zoom; roomier touch targets */
@media (hover:none) and (pointer:coarse){.x{min-width:40px;min-height:40px;display:inline-grid;place-items:center}#now{min-height:40px}}
</style></head><body>
<canvas id="stars"></canvas>
<div class="wrap">
<header><div><h1>MERIDIAN</h1><div class="add"><input id="zi" list="zones" placeholder="Add city or timezone…"><button id="ab">Add</button></div></div>
<div class="local">Your time<b id="lt"></b><span id="ld"></span></div></header>
<div class="slider"><span>Time travel</span><input type="range" id="off" min="-720" max="720" step="15" value="0"><span id="ov">now</span><button id="now" style="background:none;border:1px solid #444;color:#ccc;border-radius:20px;padding:4px 12px;cursor:pointer;font-family:inherit">Reset</button></div>
<div class="grid" id="grid"></div>
<div class="hint">Drag the slider to plan meetings across timezones. Cards are saved in your browser.</div>
</div>
<datalist id="zones"></datalist>
<script>
const $=id=>document.getElementById(id);
let zones=[];try{zones=Intl.supportedValuesOf('timeZone')}catch(e){zones=['UTC','America/New_York','America/Chicago','America/Denver','America/Los_Angeles','Europe/London','Europe/Paris','Europe/Berlin','Asia/Tokyo','Asia/Shanghai','Asia/Kolkata','Asia/Dubai','Australia/Sydney','Pacific/Auckland','America/Sao_Paulo']}
$('zones').innerHTML=zones.map(z=>`<option value="${z}">`).join('');
let list=JSON.parse(localStorage.meridian||'null')||['America/New_York','Europe/London','Asia/Tokyo','Australia/Sydney','America/Los_Angeles','Asia/Kolkata'];
const save=()=>localStorage.meridian=JSON.stringify(list);
function find(q){q=q.trim().toLowerCase().replace(/\s+/g,'_');return zones.find(z=>z.toLowerCase()===q)||zones.find(z=>z.toLowerCase().endsWith('/'+q))||zones.find(z=>z.toLowerCase().includes(q))}
$('ab').onclick=()=>{const z=find($('zi').value);if(z&&!list.includes(z)){list.push(z);save();render()}$('zi').value=''};$('zi').onkeydown=e=>{if(e.key==='Enter')$('ab').click()};
function parts(d,tz){const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit',second:'2-digit',hour12:false,weekday:'short',month:'short',day:'numeric'}).formatToParts(d);const o={};f.forEach(p=>o[p.type]=p.value);return o}
function offset(d,tz){const a=new Date(d.toLocaleString('en-US',{timeZone:tz})),b=new Date(d.toLocaleString('en-US',{timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone}));return Math.round((a-b)/3600000*10)/10}
function render(){const now=new Date(Date.now()+$('off').value*60000);const p=parts(now,undefined);
 $('lt').textContent=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:$('off').value==0?'2-digit':undefined});$('ld').textContent=now.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
 $('grid').innerHTML=list.map((tz,i)=>{const o=parts(now,tz);let h=+o.hour%24,m=+o.minute;const frac=(h*60+m)/1440;const diff=offset(now,tz);
  const day=h>=7&&h<19,work=h>=9&&h<17;const sky=day?'linear-gradient(160deg,#4aa3ff,#ffd48a)':h>=5&&h<7||h>=19&&h<21?'linear-gradient(160deg,#ff7a59,#5c3b8a)':'linear-gradient(160deg,#0c1033,#2b1a5c)';
  return`<div class="c"><div class="sky" style="background:${sky}"></div><button class="x" data-i="${i}">×</button><h3>${tz.split('/').pop().replace(/_/g,' ')}</h3><small>${tz}</small>
  <div class="t">${String(h).padStart(2,'0')}:${o.minute}<span> ${day?'☀︎':'☾'}</span></div>
  <div class="d"><span>${o.weekday}, ${o.month} ${o.day}</span><span>${diff===0?'same':(diff>0?'+':'')+diff+'h'} ${work?'· 💼 work hrs':''}</span></div>
  <div class="dayline"><i style="left:${frac*100}%"></i></div></div>`}).join('');
 document.querySelectorAll('.x').forEach(b=>b.onclick=()=>{list.splice(+b.dataset.i,1);save();render()})}
$('off').oninput=()=>{const v=+$('off').value;$('ov').textContent=v?(v>0?'+':'')+(v/60).toFixed(2).replace(/\.00$/,'')+'h':'now';render()};$('now').onclick=()=>{$('off').value=0;$('off').oninput()};
setInterval(render,1000);render();
const c=$('stars'),x=c.getContext('2d');let S=[];function rs(){c.width=innerWidth;c.height=innerHeight;S=Array.from({length:260},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.3,p:Math.random()*6}))}rs();addEventListener('resize',rs);
(function a(t){x.clearRect(0,0,c.width,c.height);const g=x.createRadialGradient(c.width*.8,c.height*.1,0,c.width*.8,c.height*.1,c.width*.7);g.addColorStop(0,'rgba(124,92,255,.18)');g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
 S.forEach(s=>{x.globalAlpha=.4+.6*Math.abs(Math.sin(t/1500+s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});x.globalAlpha=1;requestAnimationFrame(a)})(0);
</script></body></html>
